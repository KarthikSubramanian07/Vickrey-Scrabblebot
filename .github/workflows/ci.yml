name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The live bot shares this machine: keep CI from starving its bids.
  CARGO_BUILD_JOBS: "1"
  RAYON_NUM_THREADS: "2"

jobs:
  check:
    name: fmt · clippy · test
    # Self-hosted runner on a personal Mac: never run code from a fork's
    # pull request on it. Same-repository branches and pushes to main only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, vickrey]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false # keep target/ between runs: incremental builds on the self-hosted Mac
      # Self-hosted Mac: stable Rust with rustfmt and clippy is already installed.
      - run: cargo fmt --all -- --check
      - run: nice -n 19 cargo clippy --workspace --all-targets -- -D warnings
      - run: nice -n 19 cargo test --workspace --release

  regression:
    name: strategy regression gate
    runs-on: [self-hosted, vickrey]
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false # keep target/ between runs: incremental builds on the self-hosted Mac
      - run: nice -n 19 cargo build --release -p vickrey-sim --bin vickrey-arena
      - name: Six-seat table vs the calibrated field
        run: nice -n 19 ./target/release/vickrey-arena bench --lineup vickrey,shark,shark,grinder,spender,nibbler -n 36 --seed 7 --max-place 2.0
      - name: First-price table
        run: nice -n 19 ./target/release/vickrey-arena --first-price bench --lineup vickrey,shark,shark,grinder,spender,nibbler -n 24 --seed 9 --max-place 2.0
      - name: Server sims (lobby padding)
        run: nice -n 19 ./target/release/vickrey-arena bench --lineup vickrey,brutus,brutus,valor,cheapo,starter -n 8 --seed 5 --max-place 1.3
