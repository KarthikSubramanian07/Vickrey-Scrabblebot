[workspace]
resolver = "2"
members = ["crates/vickrey-core", "crates/vickrey-brain", "crates/vickrey-sim", "crates/vickrey-bot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Karthik Subramanian <winnerkarthik07@gmail.com>"]
repository = "https://github.com/KarthikSubramanian07/Vickrey-Scrabblebot"
rust-version = "1.85"

[workspace.dependencies]
vickrey-core = { path = "crates/vickrey-core" }
vickrey-brain = { path = "crates/vickrey-brain" }
vickrey-sim = { path = "crates/vickrey-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.test]
opt-level = 2
